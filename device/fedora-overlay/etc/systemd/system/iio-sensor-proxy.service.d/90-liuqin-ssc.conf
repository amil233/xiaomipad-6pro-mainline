[Unit]
# 代理启动前先让 SSC 真的返回一次加速度计测量：ssccli 取到数才会把传感器注册
# 出来，代理随后的发现才看得见它。
#
# 用 Wants= 而不是 Requires=。参考项目用 Requires 也能跑，但那是在 gate 能成功的
# 机器上；2026-11-28 的实机现象是 gate 任何一次失败都会让 D-Bus 上根本没有
# SensorProxy（monitor-sensor 只会停在 Waiting），连不需要加速度计的环境光一起
# 消失，而且没有任何可见的中间状态。Wants 保留同样的启动顺序（After），gate 失败
# 时代理照常出现，能不能出数由代理自己报。
Wants=liuqin-ssc-sample-gate.service
After=liuqin-ssc-sample-gate.service

[Service]
# 只替换二进制：单元、udev 规则、D-Bus/polkit 策略仍由 Fedora 的
# iio-sensor-proxy 包提供（参考项目在 Ubuntu 上也是这么分工的）。清空再赋值是
# systemd 的覆盖写法，不改发行包的文件。
ExecStart=
ExecStart=/usr/libexec/liuqin-iio-sensor-proxy
# libssc 走 QMI over QRTR，这个地址族要放行。上游 3.9 的单元已经带了它，
# 发行包若是 3.8 则没有，这里写一遍对两者都成立。
RestrictAddressFamilies=AF_UNIX AF_LOCAL AF_NETLINK AF_QIPCRTR
