[Unit]
# 代理启动前先让 SSC 真的返回一次加速度计测量：ssccli 取到数才会把传感器
# 注册出来，代理随后的发现才看得见它。
#
# 用 Wants= 而不是 Requires=：gate 失败只说明"这次没预热成功"，不该连代理一起
# 否掉。Ubuntu 线就是这种软关系（gate 由 target 用 Wants 拉起，代理照常启动），
# 一旦写成硬依赖，gate 的任何一次超时都会表现成 D-Bus 上根本没有 SensorProxy，
# 连不需要加速度计的环境光也一起消失。
#
# After= 仍保留：代理的发现是一次性的（udev 冷插那一刻），先预热再发现才有意义。
# 这里也不改 ExecStart、不重复地址族设置：上游 3.9 的单元
# （data/iio-sensor-proxy.service.in）已经带
# RestrictAddressFamilies=AF_UNIX AF_LOCAL AF_NETLINK AF_QIPCRTR，
# libssc 的 QRTR 连接本来就是被允许的。
Wants=liuqin-ssc-sample-gate.service
After=liuqin-ssc-sample-gate.service
