[Unit]
# 没有真实测量就不要发布 SensorProxy：加速度计要等 gate 成功。这一点和参考项目
# （yzddmr6/xiaomipad-6pro-mainline，Ubuntu 26.04 上跑通的那份）完全一致，那里也是
# Requires。
Requires=liuqin-ssc-sample-gate.service
After=liuqin-ssc-sample-gate.service

[Service]
# 只替换二进制：单元、udev 规则、D-Bus/polkit 策略仍由 Fedora 的
# iio-sensor-proxy 包提供（参考项目在 Ubuntu 上也是这么分工的）。清空再赋值是
# systemd 的覆盖写法，不改发行包的文件。
ExecStart=
ExecStart=/usr/local/libexec/liuqin-iio-sensor-proxy
# libssc 走 QMI over QRTR，这个地址族要放行。上游 3.9 的单元已经带了它，
# 发行包若是 3.8 则没有，这里写一遍对两者都成立。
RestrictAddressFamilies=AF_UNIX AF_LOCAL AF_NETLINK AF_QIPCRTR
