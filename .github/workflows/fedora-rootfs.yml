name: Fedora rootfs
# 这条工作流只服务 Fedora 那条线。它和 Ubuntu 线的 rootfs.yml 是两份东西：
# 取根的方式、包格式、桌面都不同，改一边不该碰另一边。
on:
  # GitHub 只允许对「默认分支上存在的工作流」用 API 手动触发，这个文件只活在
  # Fedora 分支上，所以用 push 触发：改动下面这几个文件就会自动跑一次。
  push:
    branches: [liuqin-installer-fedora]
    paths:
      - 'tools/build-liuqin-fedora-base.sh'
      - 'tools/build-liuqin-kernel-rpm.sh'
      - 'tools/build-liuqin-fedora-rootfs.sh'
      - 'tools/build-liuqin-fedora-image.sh'
      - 'tools/build-liuqin-fedora-boot.sh'
      - 'tools/lib/build-initramfs.sh'
      - 'initramfs/init'
      - 'tools/fedora-container.sh'
      - 'tools/lib/rootfs-manifest.sh'
      - 'tools/lib/kernel-artifact.sh'
      - 'device/configs/liuqin-fedora.config'
      - '.github/workflows/fedora-rootfs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liuqin-fedora-rootfs
  cancel-in-progress: false
jobs:
  base:
    # 只在这个分支上跑，避免在 Ubuntu 线上误触发。
    if: github.ref == 'refs/heads/liuqin-installer-fedora'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: ./project/.github/actions/free-disk

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            7zip squashfs-tools e2fsprogs rpm curl sqlite3 file

      - name: Download and verify the Live ISO
        run: sudo sh project/tools/build-liuqin-fedora-base.sh download

      - name: Extract the root tree
        run: sudo sh project/tools/build-liuqin-fedora-base.sh extract

      - name: Download the kernel artifact
        env:
          GH_TOKEN: ${{ secrets.PAT_GET_KERNEL }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PAT_GET_KERNEL is empty: add it as a repository secret" >&2
            exit 1
          fi
          repo="${{ github.repository_owner }}/linux-sm8450-liuqin"
          branch=$(python3 -c "import json;print(json.load(open('project/kernel/source.json'))['branch'])")
          run_id=$(gh run list -R "$repo" --workflow liuqin.yml \
            --branch "$branch" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          [ -n "$run_id" ] || { echo "no successful kernel run on $branch" >&2; exit 1; }
          mkdir -p project/ci
          gh run download "$run_id" -R "$repo" -D project/ci
          ls project/ci

      # The runner is Ubuntu: no rpmbuild, no dnf, no Fedora userland.  A
      # fedora:45 container gives the native aarch64 RPM tooling; the wrapper
      # pins the image platform and refuses to run if the container comes up
      # as anything but the runner's own architecture.
      - name: Build and install the kernel RPM
        run: |
          sh project/tools/fedora-container.sh \
            'sh tools/build-liuqin-kernel-rpm.sh build &&
             sh tools/build-liuqin-kernel-rpm.sh install'

      # 容器里是 root，project/out 会被它建成 root 拥有的目录。后面编拓扑、装
      # boot.img、跑报告都要以 runner 用户往这里写，所以立刻交还所有权。
      - name: Take ownership of the container output
        run: |
          [ -d project/out ] || exit 0
          sudo chown -R "$(id -u):$(id -g)" project/out

      - name: Assemble the Fedora root
        run: sudo sh project/tools/build-liuqin-fedora-rootfs.sh assemble

      - name: Install boot and image tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            device-tree-compiler m4 alsa-utils e2fsprogs android-sdk-libsparse-utils
          # 取根那一步是用 sudo 跑的，tools/local 是它建的（root 拥有）；这里要
          # 往里 clone mkbootimg，先把这一层目录交还给 runner 用户。
          sudo chown "$(id -u):$(id -g)" project/tools/local
          sh project/tools/fetch-aosp-mkbootimg.sh

      - name: Build the audio topology
        run: |
          OUTPUT="$PWD/project/out/Xiaomi-Pad-6-Pro-tplg.bin" \
          AUDIOREACH_TOPOLOGY_DIR="$PWD/project/device/audio-topology/upstream" \
            sh project/tools/build-liuqin-audio-topology.sh

      - name: Assemble boot.img
        run: |
          set -euo pipefail
          kernel_dir=$(ls -d project/ci/liuqin-kernel-* | head -1)
          sudo env \
            KERNEL_OUT="$PWD/$kernel_dir/kernel" \
            OUT_DIR="$PWD/project/out/boot" \
            AUDIO_TOPOLOGY="$PWD/project/out/Xiaomi-Pad-6-Pro-tplg.bin" \
            FIRMWARE_POOL="$PWD/project/device/firmware-pool" \
            WLAN_HSP2_TUPLE="$PWD/project/device/wlan-tuple" \
            STOCK_OVERLAY_DIR="$PWD/project/device/abl-analysis/dtbo" \
            STOCK_BASE_DIR="$PWD/project/device/abl-analysis/vendor_boot/dtbs" \
            MKBOOTIMG_DIR="$PWD/project/tools/local/aosp-mkbootimg" \
            DTC=/usr/bin/dtc FDTOVERLAY=/usr/bin/fdtoverlay \
            sh project/tools/build-liuqin-fedora-boot.sh

      - name: Build the ext4 image
        run: |
          sudo sh project/tools/build-liuqin-fedora-image.sh \
            --root "$PWD/project/tools/local/fedora-kde-mobile-45-arm64/rootfs" \
            --out "$PWD/project/out/image"

      - name: Pack the flashable set
        run: |
          set -euo pipefail
          mkdir -p project/out/upload
          sudo sh -c "cd '$PWD/project/out/image' &&
            img2simg rootfs.img rootfs.simg &&
            tar -cf - rootfs.simg | gzip -6 > rootfs.tgz &&
            sha256sum rootfs.tgz > SHA256SUMS"
          sudo cp project/out/image/rootfs.tgz project/out/image/SHA256SUMS project/out/upload/
          sudo cp project/out/boot/boot-liuqin-native.img project/out/upload/boot.img
          split -b 1900M -d -a 2 project/out/upload/rootfs.tgz project/out/upload/rootfs.tgz.part-
          # 分片已经是完整的一份，整包不用再传一遍。
          sudo rm -f project/out/upload/rootfs.tgz
          sudo chown -R "$(id -u):$(id -g)" project/out/upload
          ls -lh project/out/upload

      - name: Report
        run: |
          set -euo pipefail
          mkdir -p project/out
          report=project/out/fedora-base-report.txt
          # 清单要在这时候写：树里刚换过内核包，之前那份已经过期了。
          sudo sh project/tools/build-liuqin-fedora-base.sh manifest
          sudo sh project/tools/build-liuqin-fedora-base.sh report >"$report"
          sudo sh project/tools/build-liuqin-fedora-rootfs.sh report >>"$report"
          sh project/tools/fedora-container.sh \
            'sh tools/build-liuqin-kernel-rpm.sh check' >>"$report"
          cat "$report"
          gzip -6 -c \
            project/tools/local/fedora-kde-mobile-45-arm64/rootfs.manifest \
            >project/out/rootfs.manifest.gz
          gzip -6 -c \
            project/tools/local/fedora-kde-mobile-45-arm64/native-root.hashes \
            >project/out/native-root.hashes.gz
          cp project/out/fedora-rpm/*.aarch64.rpm project/out/
          ls -lh project/out
          df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: liuqin-fedora-base-${{ github.sha }}
          if-no-files-found: error
          compression-level: 0
          path: |
            project/out/fedora-base-report.txt
            project/out/rootfs.manifest.gz
            project/out/native-root.hashes.gz
            project/out/kernel-liuqin-*.aarch64.rpm
            project/out/upload/*
          retention-days: 7
