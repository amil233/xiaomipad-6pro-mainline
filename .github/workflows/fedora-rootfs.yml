name: Fedora rootfs
# 这条工作流只服务 Fedora 那条线。它和 Ubuntu 线的 rootfs.yml 是两份东西：
# 取根的方式、包格式、桌面都不同，改一边不该碰另一边。
on:
  # GitHub 只允许对「默认分支上存在的工作流」用 API 手动触发，这个文件只活在
  # Fedora 分支上，所以用 push 触发：改动下面这几个文件就会自动跑一次。
  push:
    branches: [liuqin-installer-fedora]
    paths:
      - 'tools/build-liuqin-fedora-base.sh'
      - 'tools/build-liuqin-kernel-rpm.sh'
      - 'tools/build-liuqin-device-rpm.sh'
      - 'tools/build-liuqin-sensors-rpm.sh'
      - 'device/sensors/**'
      - 'device/firmware/**'
      - 'device/wlan-tuple/**'
      - 'device/fedora-overlay/**'
      - 'device/gnome-overlay/usr/share/alsa/ucm2/**'
      - 'tools/build-liuqin-fedora-rootfs.sh'
      - 'tools/build-liuqin-fedora-image.sh'
      - 'tools/build-liuqin-fedora-boot.sh'
      - 'tools/verify-tree-runtime.py'
      - 'tools/lib/build-initramfs.sh'
      - 'initramfs/init'
      - 'tools/fedora-container.sh'
      - 'tools/lib/rootfs-manifest.sh'
      - 'tools/lib/kernel-artifact.sh'
      - 'device/configs/liuqin-fedora.config'
      - '.github/workflows/fedora-rootfs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liuqin-fedora-rootfs
  cancel-in-progress: false
jobs:
  base:
    # 只在这个分支上跑，避免在 Ubuntu 线上误触发。
    if: github.ref == 'refs/heads/liuqin-installer-fedora'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: ./project/.github/actions/free-disk

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            7zip squashfs-tools e2fsprogs rpm curl sqlite3 file \
            device-tree-compiler m4 alsa-utils android-sdk-libsparse-utils
          [ -d project/tools/local ] && sudo chown "$(id -u):$(id -g)" project/tools/local
          sh project/tools/fetch-busybox-arm64.sh
          sh project/tools/fetch-aosp-mkbootimg.sh

      - name: Download and verify the Live ISO
        run: sudo sh project/tools/build-liuqin-fedora-base.sh download

      - name: Extract the root tree
        run: sudo sh project/tools/build-liuqin-fedora-base.sh extract

      - name: Download the kernel artifact
        env:
          GH_TOKEN: ${{ secrets.PAT_GET_KERNEL }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PAT_GET_KERNEL is empty: add it as a repository secret" >&2
            exit 1
          fi
          repo="${{ github.repository_owner }}/linux-sm8450-liuqin"
          branch=$(python3 -c "import json;print(json.load(open('project/kernel/source.json'))['branch'])")
          run_id=$(gh run list -R "$repo" --workflow liuqin.yml \
            --branch "$branch" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          [ -n "$run_id" ] || { echo "no successful kernel run on $branch" >&2; exit 1; }
          mkdir -p project/ci
          gh run download "$run_id" -R "$repo" -D project/ci
          ls project/ci

      # The runner is Ubuntu: no rpmbuild, no dnf, no Fedora userland.  A
      # fedora:45 container gives the native aarch64 RPM tooling; the wrapper
      # pins the image platform and refuses to run if the container comes up
      # as anything but the runner's own architecture.
      - name: Build and install the kernel RPM
        run: |
          sh project/tools/fedora-container.sh \
            'sh tools/build-liuqin-kernel-rpm.sh build &&
             sh tools/build-liuqin-kernel-rpm.sh install &&
             sh tools/build-liuqin-kernel-rpm.sh check'

      # 容器里是 root，project/out 会被它建成 root 拥有的目录。后面编拓扑、装
      # boot.img、跑报告都要以 runner 用户往这里写，所以立刻交还所有权。
      - name: Build and install the device files
        run: |
          sh project/tools/fedora-container.sh \
            'OUT=/work/out/fedora-device sh tools/build-liuqin-device-rpm.sh build &&
             OUT=/work/out/fedora-device sh tools/build-liuqin-device-rpm.sh install'

      - name: Build and install the sensor userspace
        run: |
          sh project/tools/fedora-container.sh \
            'OUT=/work/out/fedora-sensors sh tools/build-liuqin-sensors-rpm.sh build &&
             OUT=/work/out/fedora-sensors sh tools/build-liuqin-sensors-rpm.sh install'

      - name: Verify the packaged files
        run: |
          # 离线断言：每个 RPM 里是否包含整条传感器链需要的文件。
          # 漏装一个文件不会让构建失败，但会让平板上的传感器链断掉。
          FEDORA_CONTAINER_PACKAGES='rpm grep coreutils' \
            sh project/tools/fedora-container.sh \
            'sh tools/verify-liuqin-rpms.sh /work/out/fedora-device /work/out/fedora-sensors /work/out/fedora-rpm'

      - name: Take ownership of the container output
        run: |
          [ -d project/out ] || exit 0
          sudo chown -R "$(id -u):$(id -g)" project/out

      - name: Assemble the Fedora root
        run: sudo sh project/tools/build-liuqin-fedora-rootfs.sh assemble

      - name: Verify the sensor chain can load inside the tree
        run: |
          # 离线判定"设备上会不会因为缺库起不来"：读 ELF 的 PT_INTERP 和
          # DT_NEEDED，顺着依赖链（libssc → libqmi-glib → libqrtr-glib）一路查到
          # 树的库目录里。这一步失败说明树里少了包，不必等刷机。
          python3 project/tools/verify-tree-runtime.py \
            project/tools/local/fedora-kde-mobile-45-arm64/rootfs

      - name: Verify the proxy can be started
        run: |
          set -euo pipefail
          root=project/tools/local/fedora-kde-mobile-45-arm64/rootfs
          # 单元、udev 规则、bus/polkit 策略和 monitor-sensor 来自 Fedora 的
          # iio-sensor-proxy 包；激活条目来自我们的包。缺任何一个，D-Bus 上都不会
          # 出现 net.hadess.SensorProxy。
          for path in \
            /usr/lib/systemd/system/iio-sensor-proxy.service \
            /usr/lib/udev/rules.d/80-iio-sensor-proxy.rules \
            /usr/share/dbus-1/system.d/net.hadess.SensorProxy.conf \
            /usr/share/polkit-1/actions/net.hadess.SensorProxy.policy \
            /usr/bin/monitor-sensor \
            /usr/libexec/liuqin-iio-sensor-proxy; do
            test -e "$root$path" || { echo "MISSING $path" >&2; exit 1; }
          done
          # 代理靠发行包的 udev 规则在设备出现时拉起（两个发行版都是这样，都没有
          # D-Bus 激活条目）。这条规则少了 SYSTEMD_WANTS，代理就只能等手动启动。
          grep -Eq 'SYSTEMD_WANTS.*iio-sensor-proxy\.service' \
            "$root/usr/lib/udev/rules.d/80-iio-sensor-proxy.rules"
          # drop-in 必须真的把 ExecStart 指到我们那份，否则跑的是发行版未打补丁的
          # 二进制（没有 SSC 支持，传感器一个都看不见）。
          grep -qx 'ExecStart=/usr/libexec/liuqin-iio-sensor-proxy' \
            "$root/etc/systemd/system/iio-sensor-proxy.service.d/90-liuqin-ssc.conf"
          # hexagonrpcd 的 -R 必须写死，且与树里的布局一致。不写时 daemon 按设备树
          # 猜目录：本机 compatible 是 qcom,sm8475，树却在 sm8450 下，猜不到就退回
          # 空前缀 /usr/share/qcom/，固件读不到 registry，传感器一个都不注册。
          grep -q -- '-R /usr/share/qcom/sm8450/Xiaomi/liuqin' \
            "$root/etc/systemd/system/liuqin-hexagonrpcd-sdsp.service"
          test -d "$root/usr/share/qcom/sm8450/Xiaomi/liuqin/sensors/config" || {
            echo "the -R path has no sensors/config in the tree" >&2; exit 1
          }
          echo "proxy startup chain OK"

      - name: Build the audio topology
        run: |
          OUTPUT="$PWD/project/out/Xiaomi-Pad-6-Pro-tplg.bin" \
          AUDIOREACH_TOPOLOGY_DIR="$PWD/project/device/audio-topology/upstream" \
            sh project/tools/build-liuqin-audio-topology.sh

      - name: Assemble boot.img
        run: |
          set -euo pipefail
          kernel_dir=$(ls -d project/ci/liuqin-kernel-* | head -1)
          sudo env \
            KERNEL_OUT="$PWD/$kernel_dir/kernel" \
            OUT_DIR="$PWD/project/out/boot" \
            AUDIO_TOPOLOGY="$PWD/project/out/Xiaomi-Pad-6-Pro-tplg.bin" \
            FIRMWARE_POOL="$PWD/project/device/firmware-pool" \
            WLAN_HSP2_TUPLE="$PWD/project/device/wlan-tuple" \
            STOCK_OVERLAY_DIR="$PWD/project/device/abl-analysis/dtbo" \
            STOCK_BASE_DIR="$PWD/project/device/abl-analysis/vendor_boot/dtbs" \
            MKBOOTIMG_DIR="$PWD/project/tools/local/aosp-mkbootimg" \
            DTC=/usr/bin/dtc FDTOVERLAY=/usr/bin/fdtoverlay \
            sh project/tools/build-liuqin-fedora-boot.sh

      - name: Build the ext4 image
        run: |
          sudo sh project/tools/build-liuqin-fedora-image.sh \
            --root "$PWD/project/tools/local/fedora-kde-mobile-45-arm64/rootfs" \
            --out "$PWD/project/out/image"

      - name: Pack the flashable set
        run: |
          set -euo pipefail
          # 所有要交出去的东西先收进一个目录，再整目录进 7z：固实压缩、按 1900 MiB
          # 分卷，产物就是 liuqin-fedora.7z.001/.002/…，7-Zip 直接能打开第一份。
          sudo install -d -o "$(id -u)" -g "$(id -g)" project/out/stage7z project/out/artifact
          sudo sh -c "cd '$PWD/project/out/image' && img2simg rootfs.img rootfs.simg"
          sudo cp project/out/image/rootfs.simg project/out/stage7z/
          sudo cp project/out/boot/boot-liuqin-native.img project/out/stage7z/boot.img
          sudo cp project/out/fedora-rpm/*.aarch64.rpm \
                  project/out/fedora-device/*.aarch64.rpm \
                  project/out/fedora-sensors/*.aarch64.rpm project/out/stage7z/
          sudo sh -c "cd '$PWD/project/out/stage7z' && sha256sum * > SHA256SUMS"
          sudo sh -c "cd '$PWD/project/out/stage7z' && \
            7z a -t7z -mx=5 -ms=on -v1900m '$PWD/project/out/artifact/liuqin-fedora.7z' ."
          sudo sh -c "cd '$PWD/project/out/artifact' && sha256sum liuqin-fedora.7z.* > SHA256SUMS"
          sudo rm -rf project/out/stage7z
          sudo chown -R "$(id -u):$(id -g)" project/out/artifact
          ls -lh project/out/artifact

      - name: Report
        run: |
          set -euo pipefail
          mkdir -p project/out
          report=project/out/fedora-report.txt
          # 清单要在这时候写：树里刚换过内核包，之前那份已经过期了。
          sudo sh project/tools/build-liuqin-fedora-base.sh manifest
          sudo sh project/tools/build-liuqin-fedora-base.sh report >"$report"
          sudo sh project/tools/build-liuqin-fedora-rootfs.sh report >>"$report"
          cat "$report"
          gzip -6 -c \
            project/tools/local/fedora-kde-mobile-45-arm64/rootfs.manifest \
            >project/out/rootfs.manifest.gz
          gzip -6 -c \
            project/tools/local/fedora-kde-mobile-45-arm64/native-root.hashes \
            >project/out/native-root.hashes.gz
          ls -lh project/out
          df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: liuqin-fedora-base-${{ github.sha }}
          if-no-files-found: error
          compression-level: 0
          path: |
            project/out/artifact/*
            project/out/fedora-report.txt
            project/out/rootfs.manifest.gz
            project/out/native-root.hashes.gz
          retention-days: 7
