name: Fedora checks
# 这个分支只服务 Fedora 那条线：能离线检查的就是脚本语法，装配和启动检查在
# fedora-rootfs 工作流里做。
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Shell and Python syntax
        run: |
          python3 - <<'PY'
          import ast
          import subprocess
          import sys
          from pathlib import Path

          for path in sorted(Path('tools').rglob('*.py')):
              ast.parse(path.read_text(), filename=str(path))
          failures = []
          for path in sorted(Path('tools').rglob('*.sh')):
              if 'tools/local/' in str(path):
                  continue
              result = subprocess.run(['sh', '-n', str(path)])
              if result.returncode:
                  failures.append(str(path))
          result = subprocess.run([sys.executable, 'tools/verify-unit-references.py'])
          if result.returncode:
              failures.append('tools/verify-unit-references.py')
          for path in ('initramfs/init',):
              if subprocess.run(['sh', '-n', path]).returncode:
                  failures.append(path)
          if failures:
              raise SystemExit('shell syntax failures: ' + ', '.join(failures))
          print('syntax ok')
          PY
