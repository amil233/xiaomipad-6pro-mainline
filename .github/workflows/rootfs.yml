name: Rootfs image
on:
  workflow_dispatch:
  push:
    branches: [liuqin-install]
    paths:
      - 'device/**'
      - 'kernel/source.json'
      - 'tools/**'
      - '.github/actions/free-disk/**'
      - '.github/workflows/rootfs.yml'
permissions:
  contents: read
concurrency:
  group: liuqin-rootfs
  cancel-in-progress: false
jobs:
  rootfs:
    # This job downloads the kernel artifact with PAT_GET_KERNEL and runs as
    # root; only trusted liuqin-install code is assembled.
    if: github.ref == 'refs/heads/liuqin-install' && (github.event_name == 'workflow_dispatch' || vars.LIUQIN_IMAGE_CI == 'enabled')
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: ./project/.github/actions/free-disk

      - name: Kernel branch
        id: kernel
        run: |
          python3 - <<'PY'
          import json, os
          branch = json.load(open('project/kernel/source.json'))['branch']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('branch=' + branch + '\n')
          PY

      - name: Install assembly tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            7zip squashfs-tools alsa-utils m4 zstd patch build-essential \
            git curl dpkg-dev file binutils e2fsprogs android-sdk-libsparse-utils

      - name: Fetch busybox
        run: sh project/tools/fetch-busybox-arm64.sh

      - name: Fetch mkbootimg
        run: sh project/tools/fetch-aosp-mkbootimg.sh

      - name: Download kernel artifact
        id: kernel_artifact
        env:
          GH_TOKEN: ${{ secrets.PAT_GET_KERNEL }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PAT_GET_KERNEL is empty: add it as a repository secret in" >&2
            echo "Settings -> Secrets and variables -> Actions (not an environment secret)." >&2
            exit 1
          fi
          repo="${{ github.repository_owner }}/linux-sm8450-liuqin"
          branch="${{ steps.kernel.outputs.branch }}"
          run_id=$(gh run list -R "$repo" --workflow liuqin.yml \
            --branch "$branch" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          [ -n "$run_id" ] || { echo "no successful kernel run on $branch" >&2; exit 1; }
          mkdir -p ci
          gh run download "$run_id" -R "$repo" -D ci
          artifact=$(find ci -maxdepth 1 -type d -name 'liuqin-kernel-*' | head -n 1)
          [ -n "$artifact" ] || { echo "kernel artifact was not downloaded" >&2; exit 1; }
          echo "artifact: $artifact"
          cat "$artifact/kernel-modules/kernel.release"
          echo "dir=$artifact" >> "$GITHUB_OUTPUT"

      - name: Preflight
        run: |
          sudo env sh project/tools/build-liuqin-rootfs.sh --check --rootfs-only --boot \
            --kernel "${{ steps.kernel_artifact.outputs.dir }}" \
            --out "$PWD/project/out/image"

      - name: Assemble rootfs
        run: |
          sudo env DROP_ISO=1 sh project/tools/build-liuqin-rootfs.sh \
            --rootfs-only --boot \
            --kernel "${{ steps.kernel_artifact.outputs.dir }}" \
            --out "$PWD/project/out/image"

      - name: Build rootfs image
        run: |
          sudo sh project/tools/build-liuqin-rootfs-image.sh \
            --rootfs "$PWD/project/out/image/root/rootfs.tar.gz" \
            --out "$PWD/project/out/image/dist"

      - name: Convert to Android sparse image
        run: |
          sudo img2simg project/out/image/dist/rootfs.img \
            project/out/image/dist/rootfs.simg
          sudo chmod 0644 project/out/image/dist/rootfs.simg
          sudo sh -c "cd '$PWD/project/out/image/dist' && sha256sum rootfs.simg > SHA256SUMS"
          sudo chmod 0644 project/out/image/dist/SHA256SUMS

      - name: Split the image for upload
        run: |
          set -euo pipefail
          # The assembly and image steps run as root; give this step an upload
          # directory it owns and make the outputs readable before splitting.
          sudo install -d -o "$(id -u)" -g "$(id -g)" project/out/upload
          sudo chmod 0644 project/out/image/dist/rootfs.simg \
            project/out/image/dist/SHA256SUMS \
            project/out/image/root/native-root.hashes \
            project/out/image/boot/boot-liuqin-native.img \
            project/out/image/boot/liuqin-firstboot.cpio.gz
          split -b 1900M -d -a 2 project/out/image/dist/rootfs.simg \
            project/out/upload/rootfs.simg.part-
          cp project/out/image/dist/SHA256SUMS project/out/upload/
          cp project/out/image/root/native-root.hashes project/out/upload/
          cp project/out/image/boot/boot-liuqin-native.img project/out/upload/boot.img
          cp project/out/image/boot/liuqin-firstboot.cpio.gz project/out/upload/
          ls -lh project/out/upload
          df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: liuqin-rootfs-${{ github.sha }}
          if-no-files-found: error
          compression-level: 0
          path: project/out/upload/
          retention-days: 7
